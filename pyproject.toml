[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-simple-monster-builder"
version = "0.1.0"
description = "Local Pathfinder Unchained simple monster creation engine"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["monster_builder*"]

[tool.setuptools.package-data]
monster_builder = ["web/dist/*.html", "web/dist/assets/*"]
