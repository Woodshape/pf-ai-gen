      return `<div class="worksheet"><section class="panel worksheet-intro"><div class="section-kicker">Variant C · Decision worksheet</div><h2>Review every decision in one surface</h2><p class="helper">Each row shows the current selection and status. Expand one row to edit it; the right-hand ledger keeps source evidence beside the decisions.</p><div class="live-note">Live behavior in this variant: edits create a new Draft revision, downstream rows re-evaluate, and the final result never hides its canonical / effective boundary.</div></section>${STEPS.map(function (step, rowIndex) { const status = stepStatus(rowIndex); const summary = stepSummary(rowIndex); return `<div><div class="worksheet-row ${status} ${index === rowIndex ? "current" : ""}" data-action="jump" data-step="${rowIndex}"><span class="worksheet-number">${esc(step.number)}</span><span class="worksheet-copy"><strong>${esc(step.label)}</strong><span>${esc(summary)}</span></span>${statusBadge(status)}<span class="worksheet-arrow">${index === rowIndex ? "⌃" : "⌄"}</span></div>${index === rowIndex ? `<div class="worksheet-detail">${renderStepContent(rowIndex)}<div class="step-actions"><button class="button" data-action="back" ${rowIndex === 0 ? "disabled" : ""}>← Previous</button><button class="button primary" data-action="next">Continue to next →</button></div></div>` : ""}</div>`; }).join("")}</div>`;
    }

    function stepSummary(index) {
      if (index === 0) return `${state.concept.role || "Role not selected"} · target CR ${state.concept.targetCR || "—"}`;
      if (index === 1) return `${currentArray().label} · ${currentArray().slots.join(" · ")}`;
      if (index === 2) return `${state.selections.creatureType} type · ${state.selections.classGraft === "none" ? "no class graft" : state.selections.classGraft}`;
      if (index === 3) return state.selections.subtype === "none" ? "No subtype graft" : state.selections.subtype;
      if (index === 4) return state.selections.template === "none" ? "No template graft" : state.selections.template;
      if (index === 5) return `${state.selections.size} · CR gate checked live`;
      if (index === 6) return state.selections.spellList ? `${state.selections.spellList} list` : "Spell list not selected";
      if (index === 7) return `${state.selections.options.length} of ${expectedOptionCount()} option slots`;
      if (index === 8) return `${state.selections.skills.master.length}/${expectedSkills().master} master · ${state.selections.skills.good.length}/${expectedSkills().good} good`;
      if (index === 9) return state.selections.attackProfile || "Attack profile not selected";
      return "";
    }

    function renderSourceLedger() {
      return `<section class="panel provenance-card"><div class="panel-head"><div><div class="section-kicker">Evidence ledger</div><h3>Where each decision comes from</h3></div><span class="tag">provenance</span></div><div class="source-ledger" style="margin-top: 13px">${STEPS.map(function (step, index) { return `<div class="source-ledger-row"><strong>${esc(step.number)} · ${esc(step.label)}</strong><span>${esc(step.source)}</span></div>`; }).join("")}</div></section>`;
    }

    function renderVariantA() {
      return `<div class="variant-label">Variant A · Guided rail — current step gets the room; all steps remain one click away.</div><div class="layout-a">${renderRail()}<main class="main-column"><div class="live-note"><strong>Live rule:</strong> edit any previous selection. The engine increments the Draft revision and recalculates dependency statuses immediately; it never silently repairs a later choice.</div>${renderStepPanel(state.currentStep, true)}</main><aside class="right-column">${renderValidationPanel()}${renderRealityPanel()}${renderStatePanel()}</aside></div>`;
    }

    function renderVariantB() {
      return `<div class="layout-b">${renderDependencyBoard()}<div class="workbench-b"><main class="b-main"><div class="live-note"><strong>Current workbench:</strong> ${esc(STEPS[state.currentStep].label)}. Forward inspection is allowed even when a prerequisite is blocked; only finalization is guarded.</div>${renderStepPanel(state.currentStep, true)}${renderDependencyDetail()}</main><aside class="b-side">${renderValidationPanel()}${renderRealityPanel()}${renderStatePanel()}</aside></div></div>`;
    }

    function renderVariantC() {
      return `<div class="layout-c">${renderWorksheet()}<aside class="provenance">${renderValidationPanel()}${renderRealityPanel()}${renderSourceLedger()}${renderStatePanel()}</aside></div>`;
    }

    function renderSwitcher() {
      const index = VARIANTS.findIndex(function (variant) { return variant.key === state.variant; });
      const current = VARIANTS[index >= 0 ? index : 0];
      return `<nav class="variant-switcher" aria-label="Prototype variants"><button data-action="variant-prev" aria-label="Previous variant">←</button><span class="switcher-label">${esc(current.key)} · ${esc(current.name)}</span><button data-action="variant-next" aria-label="Next variant">→</button></nav>`;
    }

    function renderToast() {
      if (!state.ui.toast) return "";
      return `<div class="toast ${esc(state.ui.toast.kind || "")}">${esc(state.ui.toast.text)}</div>`;
    }

    function render() {
      const root = document.getElementById("app");
      let variant = state.variant;
      if (!["A", "B", "C"].includes(variant)) variant = "A";
      state.variant = variant;
      const body = variant === "A" ? renderVariantA() : variant === "B" ? renderVariantB() : renderVariantC();
      root.innerHTML = `<div class="prototype-banner"><div class="banner-question"><strong>Throwaway prototype.</strong> ${esc("Question: should the wizard show the full path, live dependencies, safe back-jumps, and an auditable AI / Reality Check boundary?")}<span class="banner-meta">No persistence · English UI · source-linked fixture</span></div></div><div class="app">${renderTopbar()}${body}</div>${renderProposalOverlay()}${renderToast()}${renderSwitcher()}`;
    }

    function acceptProposal() {
      if (proposalStatus() === "stale") {
        state.ui.toast = { kind: "bad", text: "This proposal is stale. Regenerate it against the current Draft revision first." };
        render(); return;
      }
      if (!state.proposal.confirmed) {
        state.ui.toast = { kind: "bad", text: "Explicit user confirmation is required before typed AI changes can be applied." };
        render(); return;
      }
      const changes = state.proposal.changes.filter(function (change) { return state.proposal.selected.indexOf(change.id) >= 0; });
      if (!changes.length) {
        state.ui.toast = { kind: "bad", text: "Select at least one typed change. Plain-text suggestions cannot be applied." };
        render(); return;
      }
      changes.forEach(function (change) { change.apply(state); });
      state.proposal.status = "accepted";
      state.proposal.confirmed = false;
      state.revision += 1;
      state.fingerprint = `draft-${state.revision}-ashen-tide`;
      state.finalized = false;
      state.lastAction = `Accepted ${changes.length} typed AI change${changes.length === 1 ? "" : "s"} after confirmation.`;
      state.events.unshift({ actor: "user", text: state.lastAction, revision: state.revision });
      state.reality.visible = false; state.reality.status = "not-run"; state.reality.items = [];
      state.ui.proposalOpen = false;
      state.ui.toast = { kind: "good", text: "Typed changes were applied atomically, revisioned, and re-evaluated by the same engine boundary." };
      render();
    }

    function runReality() {
      const evaluation = evaluate();
      if (!evaluation.canonicalAvailable) {
        state.ui.toast = { kind: "bad", text: "Reality Check waits for a valid canonical Strict result." };
        render(); return;
      }
      state.reality.visible = true;
      state.reality.status = "open";
      state.reality.items = [{
        title: "Review action economy against the concept",
        text: "The canonical result now exists. Compare the oracle's spell access, selected options, attacks, defenses, and CR-based benchmark before exporting. This is a review finding, not a request to type a new attack bonus.",
        step: 7,
        source: `${SOURCE.concept} · ${SOURCE.options} · ${SOURCE.bestiary}`
      }];
      state.lastAction = "Reality Check opened a review item; no values changed.";
      state.events.unshift({ actor: "engine", text: state.lastAction, revision: state.revision });
      render();
    }

    function finalize() {
      const evaluation = evaluate();
      if (!evaluation.canonicalAvailable) {
        state.ui.toast = { kind: "bad", text: `Cannot finalize: the Draft is ${evaluation.status}. Use the issue links to jump to missing or invalid decisions.` };
        render(); return;
      }
      state.finalized = true;
      state.lastAction = "Strict Evaluation finalized; canonical and effective are identical.";
      state.events.unshift({ actor: "engine", text: state.lastAction, revision: state.revision });
      state.ui.toast = { kind: "good", text: "Valid Strict result finalized. The next step could be Reality Check, then Monster Sheet export." };
      render();
    }

    function reset() {
      const fresh = JSON.parse(JSON.stringify(INITIAL_STATE));
      Object.keys(fresh).forEach(function (key) { state[key] = fresh[key]; });
      state.proposal.changes.forEach(function (change, index) { change.apply = INITIAL_STATE.proposal.changes[index].apply; });
      state.ui.toast = { kind: "good", text: "Fixture reset. No local persistence was touched." };
      render();
    }

    document.addEventListener("click", function (event) {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "close-proposal" && target.classList.contains("modal-backdrop")) { state.ui.proposalOpen = false; render(); return; }
      if (action === "toggle-proposal") { state.ui.proposalOpen = true; render(); return; }
      if (action === "close-proposal") { state.ui.proposalOpen = false; render(); return; }
      if (action === "variant-prev" || action === "variant-next") {
        const index = VARIANTS.findIndex(function (variant) { return variant.key === state.variant; });
        const next = action === "variant-next" ? (index + 1) % VARIANTS.length : (index - 1 + VARIANTS.length) % VARIANTS.length;
        setVariant(VARIANTS[next].key); return;
      }
      if (action === "jump") { state.currentStep = Number(target.dataset.step); state.lastAction = `Opened ${STEPS[state.currentStep].label}; earlier choices remain editable.`; state.ui.toast = null; render(); return; }
      if (action === "back") { navigate(-1); return; }
      if (action === "next") { navigate(1); return; }
      if (action === "role") { mutate(`Set the encounter role to ${target.dataset.value}.`, function (s) { s.concept.role = target.dataset.value; }); return; }
      if (action === "select-array") { toggleArray(target.dataset.value); return; }
      if (action === "select-type") { mutate(`Selected the ${target.dataset.value} creature type graft.`, function (s) { s.selections.creatureType = target.dataset.value; }); return; }
      if (action === "select-class") { mutate(`Set the primary class graft to ${target.dataset.value}.`, function (s) { s.selections.classGraft = target.dataset.value; }); return; }
      if (action === "select-subtype") { mutate(`Set the subtype graft to ${target.dataset.value}.`, function (s) { s.selections.subtype = target.dataset.value; }); return; }
      if (action === "select-template") { mutate(`Set the template graft to ${target.dataset.value}.`, function (s) { s.selections.template = target.dataset.value; }); return; }
      if (action === "select-size") { mutate(`Selected ${target.dataset.value} size.`, function (s) { s.selections.size = target.dataset.value; }); return; }
      if (action === "select-spell-list") { mutate(`Selected the ${target.dataset.value} spell list.`, function (s) { s.selections.spellList = target.dataset.value; }); return; }
      if (action === "select-option") { toggleOption(target.dataset.value); return; }
      if (action === "select-skill") { toggleSkill(target.dataset.kind, target.dataset.value); return; }
      if (action === "select-attack") { mutate(`Selected the ${target.dataset.value} attack profile.`, function (s) { s.selections.attackProfile = target.dataset.value; }); return; }
      if (action === "toggle-change") { return; }
      if (action === "accept-proposal") { acceptProposal(); return; }
      if (action === "regenerate-proposal") {
        state.proposal.baseRevision = state.revision; state.proposal.baseFingerprint = state.fingerprint; state.proposal.status = "ready"; state.proposal.confirmed = false; state.lastAction = `Regenerated ${state.proposal.id} against revision ${state.revision}.`; state.events.unshift({ actor: "ai", text: state.lastAction, revision: state.revision }); state.ui.toast = { kind: "good", text: "Proposal regenerated against the current Draft; inspect the diff before accepting." }; render(); return;
      }
      if (action === "run-reality") { runReality(); return; }
      if (action === "reality-action") { state.reality.status = target.dataset.value; state.reality.items = []; state.lastAction = `Reality-Check item marked ${target.dataset.value}; no statistic changed.`; state.events.unshift({ actor: "user", text: state.lastAction, revision: state.revision }); state.ui.toast = { kind: "good", text: "Review state changed; the canonical result was not mutated." }; render(); return; }
      if (action === "finalize") { finalize(); return; }
      if (action === "reset") { reset(); return; }
    });

    document.addEventListener("change", function (event) {
      const target = event.target;
      if (target.matches("[data-field]")) {
        const field = target.dataset.field;
        const value = field === "targetCR" ? Number(target.value) : target.value;
        mutate(`Edited concept ${field}.`, function (s) { s.concept[field] = value; });
        return;
      }
      if (target.matches("[data-change-select]")) {
        const id = target.dataset.changeSelect;
        const at = state.proposal.selected.indexOf(id);
        if (target.checked && at < 0) state.proposal.selected.push(id);
        if (!target.checked && at >= 0) state.proposal.selected.splice(at, 1);
        state.proposal.confirmed = false;
        render(); return;
      }
      if (target.matches("[data-action='confirm-proposal']")) {
        state.proposal.confirmed = target.checked;
        render(); return;
      }
    });

    document.addEventListener("keydown", function (event) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || document.activeElement && document.activeElement.isContentEditable) return;
      if (event.key === "ArrowLeft") { event.preventDefault(); document.querySelector("[data-action='variant-prev']").click(); }
      if (event.key === "ArrowRight") { event.preventDefault(); document.querySelector("[data-action='variant-next']").click(); }
    });

    render();
  </script>
</body>
</html>
