<rect x="705" y="200" width="80" height="70" fill="#b8b0a3" stroke="#666" stroke-width="3"/><text x="719" y="242" class="small">Herd</text>
<circle cx="640" cy="240" r="12" fill="#c7d8df" stroke="#555"/>
