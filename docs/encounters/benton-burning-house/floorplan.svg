<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Hof der Bentons — Haupthaus</title><desc id="desc">Drei Räume: Wohnküche vorne, Speisekammer hinten links, Schlafkammer hinten rechts. Eingang mit brennendem Vordach unten, Hintertür und Rettungsfenster oben. Ein Rasterfeld entspricht fünf Fuß.</desc>
<defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse" x="160" y="140"><path d="M100 0H0V100" fill="none" stroke="#b7b0a1" stroke-width="1"/></pattern><pattern id="smoke" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16L16 0" stroke="#555" stroke-width="2" opacity=".3"/></pattern></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#24221e} .label{font-size:18px;font-weight:bold} .small{font-size:14px} .wall{fill:none;stroke:#292724;stroke-width:9;stroke-linecap:square} .furn{fill:#d1b992;stroke:#776047;stroke-width:2} .token{fill:#fff;stroke:#333;stroke-width:2}</style>
